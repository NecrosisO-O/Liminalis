name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: necrosiso-o

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set release version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA::12}"
          fi

          is_prerelease=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${version}" == *-* ]]; then
            is_prerelease=true
          fi

          {
            echo "LIMINALIS_VERSION=${version}"
            echo "IS_PRERELEASE=${is_prerelease}"
            echo "API_IMAGE_TAGS<<EOF"
            echo "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api:${version}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${is_prerelease}" = "false" ]; then
              echo "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api:latest"
            fi
            echo "EOF"
            echo "MIGRATE_IMAGE_TAGS<<EOF"
            echo "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api-migrate:${version}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${is_prerelease}" = "false" ]; then
              echo "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api-migrate:latest"
            fi
            echo "EOF"
            echo "WEB_IMAGE_TAGS<<EOF"
            echo "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-web:${version}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${is_prerelease}" = "false" ]; then
              echo "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-web:latest"
            fi
            echo "EOF"
            echo "ADMIN_IMAGE_TAGS<<EOF"
            echo "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-admin:${version}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${is_prerelease}" = "false" ]; then
              echo "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-admin:latest"
            fi
            echo "EOF"
          } >>"${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ env.API_IMAGE_TAGS }}
          load: ${{ github.ref_type != 'tag' }}

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ env.MIGRATE_IMAGE_TAGS }}
          load: ${{ github.ref_type != 'tag' }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ env.WEB_IMAGE_TAGS }}
          load: ${{ github.ref_type != 'tag' }}

      - name: Build and push admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ env.ADMIN_IMAGE_TAGS }}
          load: ${{ github.ref_type != 'tag' }}

      - name: Check API image contents
        if: ${{ github.ref_type != 'tag' }}
        run: |
          scripts/check-deployment-artifacts.sh \
            --api-image "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api:${LIMINALIS_VERSION}" \
            --migrate-image "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api-migrate:${LIMINALIS_VERSION}"

      - name: Check pushed API and migration image contents
        if: ${{ github.ref_type == 'tag' }}
        run: |
          docker pull "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api:${LIMINALIS_VERSION}"
          docker pull "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api-migrate:${LIMINALIS_VERSION}"
          scripts/check-deployment-artifacts.sh \
            --api-image "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api:${LIMINALIS_VERSION}" \
            --migrate-image "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api-migrate:${LIMINALIS_VERSION}"

      - name: Build deploy bundle
        run: |
          bundle="$(scripts/build-deploy-bundle.sh)"
          cp "${bundle}" "dist/deploy/liminalis-deploy.tar.gz"
          echo "BUNDLE_PATH=${bundle}" >>"${GITHUB_ENV}"

      - name: Check deploy bundle contents
        run: |
          scripts/check-deployment-artifacts.sh --bundle "${BUNDLE_PATH}"
          scripts/check-deployment-artifacts.sh --bundle "dist/deploy/liminalis-deploy.tar.gz"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liminalis-deploy-bundle
          path: |
            ${{ env.BUNDLE_PATH }}
            dist/deploy/liminalis-deploy.tar.gz

      - name: Attach deploy bundle to GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.IS_PRERELEASE == 'true' && 'false' || 'true' }}
          files: |
            ${{ env.BUNDLE_PATH }}
            dist/deploy/liminalis-deploy.tar.gz
