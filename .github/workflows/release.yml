name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: necrosiso-o

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set release version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "LIMINALIS_VERSION=${GITHUB_REF_NAME}" >>"${GITHUB_ENV}"
          else
            echo "LIMINALIS_VERSION=dev-${GITHUB_SHA::12}" >>"${GITHUB_ENV}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/liminalis-api:${{ env.LIMINALIS_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/liminalis-api:latest
          load: ${{ github.ref_type != 'tag' }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/liminalis-web:${{ env.LIMINALIS_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/liminalis-web:latest
          load: ${{ github.ref_type != 'tag' }}

      - name: Build and push admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/liminalis-admin:${{ env.LIMINALIS_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/liminalis-admin:latest
          load: ${{ github.ref_type != 'tag' }}

      - name: Check API image contents
        if: ${{ github.ref_type != 'tag' }}
        run: scripts/check-deployment-artifacts.sh --api-image "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api:${LIMINALIS_VERSION}"

      - name: Check pushed API image contents
        if: ${{ github.ref_type == 'tag' }}
        run: |
          docker pull "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api:${LIMINALIS_VERSION}"
          scripts/check-deployment-artifacts.sh --api-image "${REGISTRY}/${IMAGE_NAMESPACE}/liminalis-api:${LIMINALIS_VERSION}"

      - name: Build deploy bundle
        run: |
          bundle="$(scripts/build-deploy-bundle.sh)"
          cp "${bundle}" "dist/deploy/liminalis-deploy.tar.gz"
          echo "BUNDLE_PATH=${bundle}" >>"${GITHUB_ENV}"

      - name: Check deploy bundle contents
        run: |
          scripts/check-deployment-artifacts.sh --bundle "${BUNDLE_PATH}"
          scripts/check-deployment-artifacts.sh --bundle "dist/deploy/liminalis-deploy.tar.gz"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liminalis-deploy-bundle
          path: |
            ${{ env.BUNDLE_PATH }}
            dist/deploy/liminalis-deploy.tar.gz

      - name: Attach deploy bundle to GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUNDLE_PATH }}
            dist/deploy/liminalis-deploy.tar.gz
